<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{border: 1px solid black}
        .container{height: 700px; position: relative;}
        
        .box{height: 50px; height: 50px; display: inline-block;}
        #box1{
            position: fixed;
            top: 0px;
            left: 0px;
            background-color: green;
        }
        #box2{
            position: fixed; /*relative posiciona em relação ao viw port*/
            right: 0px;
            top: 0px;
            background-color: yellow;
        }
        #box3{
            position: fixed; /* absolute se posiciona em relação ao primeiro ancestral não estático*/
            left: 0px;
            bottom: 0px;
            background-color:blue;
        }
        #box4{
            position: fixed; /* se posiciona em relação ao primeiro ancestral não estático*/
            bottom: 0px;
            right: 0px;
            background-color: grey;
        }
        #box5{
            position: fixed; /* se posiciona em relação ao primeiro ancestral não estático*/
            top: 50%;
            left: 50%;
            background-color: pink;
            transform: translate(-50% ,-50%);
        }
    </style>
</head>
<body>
    <h1>Positions</h1>
    <div class="container">
        <div class="box" id="box1">box-1</div>
        <div class="box" id="box2">box-2</div>
        <div class="box" id="box3">box-3</div>
        <div class="box" id="box4">box-4</div>
        <div class="box" id="box5">box-5</div>
    </div>
</body>
</html>
